name: Init from template
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  init:
    # never run in the template repo itself
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for template placeholders
        id: check
        run: |
          if grep -qs '__NAME__' README.md mkdocs.yml docs/index.md; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fill placeholders in README.md, mkdocs.yml and docs/index.md
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          DESC=$(gh api "repos/${{ github.repository }}" --jq '.description // ""')
          if [ -z "$DESC" ]; then
            DESC="A Chivalry 2 mod built with ArgonSDK."
          fi
          export DESC

          perl -pi -e 's/__NAME__/$ENV{NAME}/g; s/__DESCRIPTION__/$ENV{DESC}/g; s/__SITE_URL__/$ENV{SITE_URL}/g; s/__REPO_URL__/$ENV{REPO_URL}/g' README.md mkdocs.yml docs/index.md

      - name: Commit
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mkdocs.yml docs/index.md
          git commit -m "Initialize from template"
          git push

      # pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly
      - name: Deploy site
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
