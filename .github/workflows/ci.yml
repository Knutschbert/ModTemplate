name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material mkdocs-roamlinks-plugin
      - run: mkdocs gh-deploy --force
      - name: Enable GitHub Pages (first run only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAGES_PAT || github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/"
          fi
